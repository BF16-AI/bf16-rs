[package]
name = "bf16"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Official Rust SDK for bf16.ai — uncensored 1M-context LLM inference API with prompt caching and strict Zero Data Retention."
homepage = "https://bf16.ai"
repository = "https://github.com/BF16-AI/bf16-rs"
documentation = "https://docs.rs/bf16"
readme = "README.md"
keywords = ["bf16", "llm", "ai", "openai", "anthropic"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
